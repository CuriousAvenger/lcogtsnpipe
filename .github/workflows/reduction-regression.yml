name: Reduction regression

on:
  # Temporary: triggers automatically on push to any branch (e.g. python3-pytest) for testing
  push:
  workflow_dispatch:

  # Production configuration (uncomment when ready for production):
  # push:
  #   branches: [ master ]
  # pull_request:
  #   branches: [ master ]

permissions:
  contents: read

concurrency:
  group: reduction-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reduction-drift:
    name: ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        case:
          - basic-reduction/2023ixf-2m0
        # Production matrix (uncomment all cases for full regression suite):
        # - basic-reduction/2017cbv
        # - uband-reduction/2017cbv
        # - diff-subtraction/2018cow
        # - basic-reduction/2023ixf-0m4
        # - basic-reduction/2023ixf-2m0
    env:
      LCO_API_KEY: ${{ secrets.LCO_API_KEY }}

    steps:
      - name: Check LCO archive credentials
        run: |
          if [[ -z "$LCO_API_KEY" ]]; then
            echo "Set the LCO_API_KEY Actions secret to run the reduction cases." >&2
            exit 1
          fi

      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          path: branch

      - name: Check out reference master branch
        uses: actions/checkout@v4
        with:
          ref: master
          path: master

      - name: Run reference reduction on master
        run: ./branch/ci/reduction/reduction.sh master ./master "${{ matrix.case }}"

      - name: Run candidate reduction on branch
        run: ./branch/ci/reduction/reduction.sh branch ./branch "${{ matrix.case }}"

      - name: Compare reduction drift between master and branch
        run: |
          python3 ./branch/ci/reduction/compare.py \
            --reference ./branch/artifacts/dumps/master_dump.json \
            --candidate ./branch/artifacts/dumps/branch_dump.json

      - name: Save reduction logs and database dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reduction-drift-${{ strategy.job-index }}-${{ github.run_id }}
          path: |
            branch/artifacts/dumps/
            branch/artifacts/reduction-runs/*/logs/
          if-no-files-found: ignore
          retention-days: 14
